name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The text cleaner must cope with Windows (CRLF) and Unix line endings alike
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
      - run: npx @vscode/vsce package -o audiowizard.vsix
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: audiowizard-vsix
          path: audiowizard.vsix
